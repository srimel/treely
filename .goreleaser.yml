version: 2
before:
  hooks:
    - go mod tidy
builds:
  - id: treely
    main: ./cmd/treely
    binary: treely
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
archives:
  - format: tar.gz
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        format: zip
checksum:
  name_template: checksums.txt
release:
  github:
    owner: srimel
    name: treely
